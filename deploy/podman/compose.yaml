name: ${COMPOSE_PROJECT_NAME:-whilo-podman}
services:
  whilo:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/whilo-podman:${WHILO_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${WHILO_DATA_ROOT:?Run setup.sh first}:${WHILO_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/whilo-podman.sock
    environment:
      HOME: ${WHILO_DATA_ROOT}
      WHILO_DATA_DIR: ${WHILO_DATA_ROOT}/.whilo
      WHILO_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/whilo-podman.sock
      WHILO_PORT: ${WHILO_PORT:-8799}
      WHILO_WEBHOOK_PORT: ${WHILO_WEBHOOK_PORT:-8800}
      WHILO_PUBLIC_URL: ${WHILO_PUBLIC_URL:-http://localhost:8080}
      WHILO_WEBHOOK_PUBLIC_URL: ${WHILO_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$WHILO_PORT/api/health | grep -q whilo']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      whilo:
        condition: service_healthy
    environment:
      WHILO_HTTP_PORT: ${WHILO_HTTP_PORT:-8080}
      WHILO_PORT: ${WHILO_PORT:-8799}
      WHILO_WEBHOOK_PORT: ${WHILO_WEBHOOK_PORT:-8800}
      WHILO_HTTPS_HOST: ${WHILO_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
