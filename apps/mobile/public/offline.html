<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whilo — offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f5f5f7; color: #141414;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: rgba(20,20,20,.64); font-size: 14px; line-height: 1.5; }
      button {
        font: inherit; font-size: 15px; padding: 10px 20px; border: 0; border-radius: 10px;
        background: #6960f1; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-192.png" alt="" />
      <h1>Whilo is offline</h1>
      <p>Reconnect to continue. Your chats and agents will be right where you left them.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
