# Docker starts the Whilo containers when it starts. `whilo-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/whilo.conf.
[Unit]
# No container starts without its firewall: when whilo-firewall fails, Docker does not start.
Requires=whilo-firewall.service
After=whilo-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
