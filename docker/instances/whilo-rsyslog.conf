# The container logs of the Whilo instances. `whilo-instance setup` installs it as
# /etc/rsyslog.d/30-whilo-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. whilo-logrotate keeps the files for 30 days.
template(name="WhiloDockerFile" type="string" string="/var/log/whilo/%programname%.log")
template(name="WhiloDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="whilo-docker") {
  # The tag is the container name, which whilo-instance gives.
  if $programname startswith "whilo-" then {
    # setup makes /var/log/whilo for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="WhiloDockerFile" template="WhiloDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/whilo-docker/dev/log" ruleset="whilo-docker" createPath="off")
